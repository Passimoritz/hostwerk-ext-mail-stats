<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ext-sdk.js"></script>
  <style>
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 14px 0 18px; }
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding: 10px 4px 0; }
    .bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
    .bar { width: 100%; border-radius: 6px 6px 2px 2px; background: var(--hw-accent); min-height: 2px; }
    .tops { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 18px; }
    .row { display: flex; gap: 10px; padding: 4px 0; font-size: 13px; border-bottom: 1px solid var(--hw-line); }
  </style>
</head>
<body>
  <h1 data-i18n="title"></h1>
  <p class="hw-sub" data-i18n="sub"></p>
  <div class="stats" id="stats"><div class="hw-skeleton" style="height:70px"></div></div>
  <div class="hw-card"><h3 class="hw-h3" data-i18n="perDay"></h3><div id="chart"></div></div>
  <div class="tops" id="tops"></div>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
